{% extends "base.html" %}

{% block content %}

<section class="hero">
    <h1>Products</h1>
    <p>Choose a product.</p>
</section>

<div class="grid">

    {% for p in products %}
    <div class="card">

        <h2>{{ p.name }}</h2>

        <p>{{ p.description }}</p>

        <div class="price">
            ${{ p.price }}
        </div>

        <a class="btn"
           href="/products/{{ p.id }}">
            View
        </a>

    </div>
    {% endfor %}

</div>

{% endblock %}
