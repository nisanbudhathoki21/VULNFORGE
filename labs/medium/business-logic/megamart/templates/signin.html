{% extends "base.html" %}

{% block title %}Sign in — MegaMart{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">

        <div class="auth-heading">
            <span class="eyebrow">MEGAMART ACCOUNT</span>
            <h1>Welcome back.</h1>
            <p>Sign in to manage your account and orders.</p>
        </div>

        {% if error %}
        <div class="form-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="auth-form">

            <label for="email">Email</label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Your password"
                required
            >

            <button
                class="button button-dark button-full"
                type="submit"
            >
                Sign in
            </button>

        </form>

        <div class="demo-box">
            <span>LOCAL LAB DEMO</span>

            <strong>Alice</strong>
            <code>alice@example.com</code>
            <code>Alice@12345!</code>
        </div>

    </div>
</section>

{% endblock %}
