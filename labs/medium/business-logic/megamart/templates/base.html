<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}MegaMart{% endblock %}</title>

    <meta
        name="description"
        content="MegaMart local e-commerce security training laboratory"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-mark">M</span>
            <span class="brand-name">MegaMart</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('products') }}">Products</a>
            <a href="{{ url_for('search') }}">Search</a>
        </nav>

        <div class="header-actions">

            <a class="header-link" href="{{ url_for('cart') }}">
                Cart
                <span class="cart-count">{{ cart_count }}</span>
            </a>

            {% if current_user %}
                <a class="header-link" href="{{ url_for('account') }}">
                    Account
                </a>
            {% else %}
                <a class="header-link" href="{{ url_for('signin') }}">
                    Sign in
                </a>
            {% endif %}

        </div>

    </div>
</header>


<main>
    {% block content %}{% endblock %}
</main>


<footer class="site-footer">
    <div class="footer-inner">

        <div>
            <div class="footer-brand">MegaMart</div>
            <p>
                Modern products. Simple shopping.
            </p>
        </div>

        <div class="footer-lab">
            <span>LOCAL SECURITY TRAINING LAB</span>
            <strong>MEDIUM</strong>
        </div>

    </div>
</footer>

<script
    src="{{ url_for('static', filename='js/app.js') }}"
    defer>
</script>

</body>
</html>
