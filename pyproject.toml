[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnforge"
version = "0.4.0"
description = "VulnForge — evidence-led web security assessment engine for authorized testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nisan Budhathoki" }]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
]
browser = [
    "playwright>=1.48,<2",
]
dev = [
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
]
[project.scripts]
vulnforge = "vulnforge.cli:main"

[tool.pytest.ini_options]
testpaths = ["vulnforge/tests"]

[tool.setuptools.packages.find]
include = ["vulnforge*", "labs*"]
exclude = ["vulnforge.tests*"]

[tool.setuptools.package-data]
vulnforge = ["dashboard_static/*"]
